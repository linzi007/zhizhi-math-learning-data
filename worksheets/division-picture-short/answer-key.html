<meta charset="utf-8"><style>@page{size:A4;margin:14mm}body{font-family:"Noto Sans CJK SC";font-size:16px;line-height:1.7}h1{text-align:center;font-size:23px}h2{font-size:17px;margin:15px 0 7px}.space{height:48px}.note{font-size:12px}.g{display:inline-block;border:1px solid;padding:5px 9px;border-radius:12px;margin:4px}</style><h1>考前短练 · 家长答案</h1><h2>第1题</h2><p>12÷4＝3（颗）。画4组，每组3颗。</p><h2>第2题</h2><p>12÷4＝3（个）。每4颗一组，画3组。</p><h2>第3题</h2><p>第1题：每盒3颗珠子；第2题：需要3个盒子。</p><h2>第4题</h2><p>4×3＋3＝15（个）；4×4－1＝15（个）。先当作4组4个，多算1个，减去1。</p><h2>第5题</h2><p>示例：12元可以买几把水枪？12÷4＝3（把）。其他条件充分、符合价格且在1—6口诀范围内的除法问题也可。</p><h2>第6题</h2><p>乙包更省钱，18－15＝3（元），少花3元。</p><p>先让孩子独立做，再询问每个数表示什么。提示后完成请注明。画图分组结构比图形是否美观重要；不能仅凭得数正确判定理解。</p>
